version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    allow:
      - dependency-type: development
        update-types:
          - version-update:semver-patch
    groups:
      root-dev-patch:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    allow:
      - dependency-name: prisma
        update-types:
          - version-update:semver-patch
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-patch
      - dependency-type: development
        update-types:
          - version-update:semver-patch
    groups:
      backend-prisma-patch:
        patterns:
          - prisma
          - "@prisma/client"
        update-types:
          - patch
      backend-dev-patch:
        patterns:
          - "*"
        exclude-patterns:
          - prisma
          - "@prisma/client"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-patch
      - dependency-name: typescript
        update-types:
          - version-update:semver-patch
    groups:
      desktop-tooling-patch:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
