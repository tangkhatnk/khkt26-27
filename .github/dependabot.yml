version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      root-patch:
        patterns:
          - "*"
        update-types:
          - patch
      root-minor:
        patterns:
          - "*"
        update-types:
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "pdfjs-dist"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "officeparser"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "tesseract.js"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@tesseract.js-data/*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      backend-prisma:
        patterns:
          - prisma
          - "@prisma/client"
        update-types:
          - patch
          - minor
      backend-patch:
        patterns:
          - "*"
        exclude-patterns:
          - prisma
          - "@prisma/client"
        update-types:
          - patch
      backend-minor:
        patterns:
          - "*"
        exclude-patterns:
          - prisma
          - "@prisma/client"
        update-types:
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      desktop-patch:
        patterns:
          - "*"
        update-types:
          - patch
      desktop-minor:
        patterns:
          - "*"
        update-types:
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
