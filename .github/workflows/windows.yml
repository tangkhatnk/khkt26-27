name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Test web
        run: npm run test:web

      - name: Build web
        run: npm run build:web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://viendu.up.railway.app/api/v1' }}

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Typecheck desktop
        run: npm --prefix desktop run typecheck

      - name: Test desktop
        run: npm --prefix desktop test

      - name: Package Windows installer
        run: npm --prefix desktop run package:win

      - name: Package matching web build
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          Compress-Archive -Path dist/* -DestinationPath "desktop/release/Vien-Du-Web-$version.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vien-Du-Windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
